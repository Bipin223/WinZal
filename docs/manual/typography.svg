    <text x="858" y="140" text-anchor="end" fill="#5f5f65" font-size="10">13 px · 450</text>

    <line x1="42" y1="166" x2="858" y2="166" stroke="#1c1c1e"/>
    <text x="42" y="196" fill="#7c7c82" font-size="10" letter-spacing="1.4">BODY</text>
    <text x="170" y="198" fill="#f2f2f4" font-size="14" font-weight="450">Body · normal text used across the notch.</text>
