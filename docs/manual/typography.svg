    <text x="858" y="86" text-anchor="end" fill="#5f5f65" font-size="10">12 px · 500</text>

    <line x1="42" y1="112" x2="858" y2="112" stroke="#1c1c1e"/>
    <text x="42" y="140" fill="#7c7c82" font-size="10" letter-spacing="1.4">FOOTNOTE</text>
