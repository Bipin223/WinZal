<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#0b0b0c"/>
  <text x="450" y="28" text-anchor="middle" fill="#7c7c82" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="2.4">FONT ROLES · SIZE + WEIGHT</text>

  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <line x1="42" y1="58" x2="858" y2="58" stroke="#1c1c1e"/>
